<!doctype html>
<meta charset="utf-8">
<title>Dayboard local board transfer</title>
<script>
  if (location.origin === 'http://dayboard.localhost:8080' && parent !== window) {
    const saved = {};
    for (const key of ['dayboard.board.v2', 'dayboard.board.v1', 'dayboard.sidebar-hidden', 'dayboard.viewport']) {
      try {
        saved[key] = localStorage.getItem(key);
      } catch {
        break;
      }
    }
    parent.postMessage({ type: 'dayboard-local-transfer', saved }, 'http://dayboard.localhost');
  }
</script>
